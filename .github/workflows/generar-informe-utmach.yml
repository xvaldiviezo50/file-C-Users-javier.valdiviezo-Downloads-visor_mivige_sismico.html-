name: Generar informe Word UTMACH
on:
  push:
    paths:
      - 'competencias-utmach/generar_informe.py'
      - '.github/workflows/generar-informe-utmach.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx matplotlib numpy
      - run: python competencias-utmach/generar_informe.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competencias-utmach/Informe_Ejecutivo_Competencias_Digitales_UTMACH_CEDIA.docx competencias-utmach/report_assets
          git diff --cached --quiet || git commit -m "Generar informe Word ejecutivo UTMACH"
          git push
