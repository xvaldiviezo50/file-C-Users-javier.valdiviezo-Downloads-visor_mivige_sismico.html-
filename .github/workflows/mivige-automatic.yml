name: MIVIGE automatic evidence and windows
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'mivige-v2/scripts/collect_automatic.py'
      - 'mivige-v2/scripts/collect_history.cjs'
      - 'mivige-v2/history-cache.js'
      - 'mivige-v2/scripts/collect_rain.py'
      - 'mivige-v2/rain-layer.js'
      - 'mivige-v2/scripts/test_collect_automatic.py'
      - 'mivige-v2/automatic-monitor.js'
      - '.github/workflows/mivige-automatic.yml'
permissions:
  contents: write
concurrency:
  group: mivige-automatic
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s mivige-v2/scripts -p 'test_collect_automatic.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check mivige-v2/model.js && node --check mivige-v2/history-cache.js
      - run: node --check mivige-v2/rain-layer.js
      - name: Collect optional rain evidence
        continue-on-error: true
        run: |
          for i in 1 2 3; do python mivige-v2/scripts/collect_rain.py && break; sleep $((i*10)); done
      - name: Collect history
        continue-on-error: true
        run: |
          for i in 1 2 3; do node mivige-v2/scripts/collect_history.cjs && break; sleep $((i*10)); done
      - name: Collect core automatic evidence
        run: |
          for i in 1 2 3; do
            python mivige-v2/scripts/collect_automatic.py && break
            test "$i" -eq 3 && exit 1
            sleep $((i*15))
          done
      - name: Verify fresh core state
        run: |
          python - <<'PY'
          import json, datetime as dt, pathlib
          p=pathlib.Path('mivige-v2/data/automatic.json')
          a=json.loads(p.read_text())
          t=dt.datetime.fromisoformat(a['generated_at'].replace('Z','+00:00'))
          age=(dt.datetime.now(dt.timezone.utc)-t).total_seconds()
          if a.get('run_status') != 'ok':
              raise SystemExit('automatic.json run_status is not ok')
          if age < -300 or age > 5400:
              raise SystemExit(f'automatic.json stale: {age/60:.1f} min')
          print(f'automatic.json fresh: {age/60:.1f} min')
          PY
      - name: Preserve central record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mivige-v2/data/automatic*.json mivige-v2/data/observations-history.json mivige-v2/data/rain-products.json
          if ! git diff --cached --quiet; then
            # Do not commit generated files before synchronizing: rebasing a
            # generated-data commit is what caused the recurring conflicts.
            git reset
            git fetch origin main
            git reset --hard origin/main

            # Regenerate deterministically on the newest main.
            for i in 1 2 3; do python mivige-v2/scripts/collect_rain.py && break; sleep $((i*10)); done || true
            for i in 1 2 3; do node mivige-v2/scripts/collect_history.cjs && break; sleep $((i*10)); done || true
            for i in 1 2 3; do
              python mivige-v2/scripts/collect_automatic.py && break
              test "$i" -eq 3 && exit 1
              sleep $((i*15))
            done

            git add mivige-v2/data/automatic*.json mivige-v2/data/observations-history.json mivige-v2/data/rain-products.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record automatic evidence and prospective windows'
              git push origin HEAD:main
            fi
          fi


