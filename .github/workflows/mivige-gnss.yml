name: Actualizar GNSS regional MIVIGE
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'mivige-v2/scripts/collect_gnss.py'
      - 'mivige-v2/segments.json'
      - '.github/workflows/mivige-gnss.yml'
permissions:
  contents: write
concurrency:
  group: mivige-gnss
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s mivige-v2/scripts -p 'test_*.py'
      - run: python mivige-v2/scripts/collect_gnss.py
      - name: Publicar snapshot verificable
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mivige-v2/data/gnss.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar observaciones GNSS NGL y cobertura regional'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
