name: MIVIGE persistent learning
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/mivige_learning.py
      - run: |
          git config user.name mivige-bot
          git config user.email actions@users.noreply.github.com
          git add mivige-v2/data/learning-state.json
          git diff --cached --quiet || git commit -m "MIVIGE hourly learning snapshot"
          git push
