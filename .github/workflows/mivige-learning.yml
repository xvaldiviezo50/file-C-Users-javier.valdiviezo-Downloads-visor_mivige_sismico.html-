name: MIVIGE persistent learning
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/mivige_learning.py"
      - "scripts/learning_targets.py"
      - "scripts/test_learning_targets.py"
      - ".github/workflows/mivige-learning.yml"
permissions:
  contents: write
concurrency:
  group: mivige-persistent-learning
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts -p "test_learning_targets.py"
      - run: python scripts/mivige_learning.py
      - run: |
          git config user.name mivige-bot
          git config user.email actions@users.noreply.github.com
          git add mivige-v2/data/learning-state.json
          git diff --cached --quiet || git commit -m "MIVIGE hourly learning snapshot"
          git pull --rebase origin main
          git push
